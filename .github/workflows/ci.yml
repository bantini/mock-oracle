name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: node-oracledb ${{ matrix.oracledb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oracledb: ['6', '7']
    defaults:
      run:
        working-directory: crates/mock-oracle-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save oracledb@${{ matrix.oracledb }}
      - run: npm run build:debug
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mock-oracle .
      - run: docker run -d --name mock-oracle -p 1521:1521 mock-oracle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Connect with node-oracledb
        working-directory: crates/mock-oracle-node
        run: |
          npm install --no-save oracledb
          node scripts/smoke.js localhost:1521/FREEPDB1
      - if: failure()
        run: docker logs mock-oracle
