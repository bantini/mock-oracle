name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: node-oracledb ${{ matrix.oracledb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oracledb: ['6', '7']
    defaults:
      run:
        working-directory: crates/mock-oracle-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save oracledb@${{ matrix.oracledb }}
      - run: npm run build:debug
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Instrument both the Rust tests and the Node addon, so code reached
      # through node-oracledb over the wire protocol counts too.
      - name: Run tests with coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --workspace
          (cd crates/mock-oracle-node && npm ci && npm run build:debug && npm test)
          cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mock-oracle .
      - run: docker run -d --name mock-oracle -p 1521:1521 mock-oracle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Connect with node-oracledb
        working-directory: crates/mock-oracle-node
        run: |
          npm install --no-save oracledb
          node scripts/smoke.js localhost:1521/FREEPDB1
      - if: failure()
        run: docker logs mock-oracle
